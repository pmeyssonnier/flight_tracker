name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:   # déploiement manuel possible depuis n'importe quelle branche

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Préparer le site (index.html seul, sans .env ni scripts)
        run: |
          mkdir -p public
          cp index.html public/
          touch public/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true   # active GitHub Pages (source : Actions) si besoin
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
